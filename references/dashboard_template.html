<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业对比看板</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/14.1.0/marked.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f6fa; color: #2c3e50; display: flex; min-height: 100vh; }
.sidebar { width: 220px; background: #fff; border-right: 1px solid #e8e8e8; padding: 20px 0; flex-shrink: 0; display: flex; flex-direction: column; }
.sidebar h2 { font-size: 16px; padding: 0 16px 16px; border-bottom: 1px solid #eee; margin-bottom: 8px; color: #1a1a2e; }
.company-tab { padding: 10px 16px; cursor: pointer; font-size: 14px; border-left: 3px solid transparent; transition: all 0.2s; display: flex; align-items: center; gap: 8px; }
.company-tab:hover { background: #f0f4ff; }
.company-tab.active { background: #eef2ff; border-left-color: #4361ee; font-weight: 600; color: #4361ee; }
.company-tab .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.company-tab .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.company-tab .score-tag { font-size: 11px; color: #999; flex-shrink: 0; }
.company-tab .delete-btn { width: 20px; height: 20px; border: none; background: none; cursor: pointer; color: #bbb; font-size: 16px; line-height: 20px; text-align: center; border-radius: 4px; opacity: 0; transition: all 0.2s; flex-shrink: 0; }
.company-tab:hover .delete-btn { opacity: 1; }
.company-tab .delete-btn:hover { color: #e24b4a; background: #fee; }
.add-btn { display: flex; align-items: center; gap: 6px; padding: 10px 16px; cursor: pointer; font-size: 14px; border: 1px dashed #4361ee; color: #4361ee; border-radius: 8px; margin: 12px 16px 8px; transition: all 0.2s; justify-content: center; }
.add-btn:hover { background: #eef2ff; border-color: #4361ee; }
.sidebar-spacer { flex: 1; }
.main { flex: 1; padding: 24px; overflow-y: auto; }
.header { margin-bottom: 20px; }
.header h1 { font-size: 22px; color: #1a1a2e; }
.header .badge { display: inline-block; background: #4361ee; color: #fff; font-size: 12px; padding: 3px 10px; border-radius: 12px; margin-left: 10px; vertical-align: middle; }
/* 对比视图 */
.compare-view { }
.compare-view .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
.chart-card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.chart-card h3 { font-size: 15px; margin-bottom: 12px; color: #555; }
.chart-card canvas { max-height: 360px; }
/* 对比表格 */
.compare-table { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); overflow-x: auto; margin-bottom: 20px; }
.compare-table h3 { font-size: 15px; margin-bottom: 14px; color: #555; }
.compare-table table { width: 100%; border-collapse: collapse; font-size: 13px; }
.compare-table th, .compare-table td { padding: 10px 8px; text-align: center; border-bottom: 1px solid #f0f0f0; }
.compare-table th { background: #fafbfc; font-weight: 600; color: #555; white-space: nowrap; position: sticky; top: 0; }
.compare-table th:first-child, .compare-table td:first-child { text-align: left; font-weight: 600; }
.compare-table .score-high { color: #639922; font-weight: 700; }
.compare-table .score-mid { color: #EF9F27; font-weight: 600; }
.compare-table .score-low { color: #E24B4A; font-weight: 600; }
.compare-table .highlight { background: #f6ffed; }
.compare-table tr:hover td { background: #fafbff; }
.compare-table th.sortable { cursor: pointer; user-select: none; transition: background 0.15s; }
.compare-table th.sortable:hover { background: #eef2ff; }
.compare-table th .sort-btn { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; margin-left: 6px; border-radius: 4px; font-size: 11px; line-height: 1; color: #aaa; border: 1px solid #e2e5ec; background: #fdfdfe; transition: all 0.15s; }
.compare-table th.sortable:hover .sort-btn { background: #eef2ff; border-color: #c7d2fe; color: #4361ee; }
.compare-table th .sort-btn.active { background: #4361ee; border-color: #4361ee; color: #fff; }
.compare-table th .dim-toggle { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; margin-left: 10px; border-radius: 3px; font-size: 10px; line-height: 1; vertical-align: middle; transition: all 0.15s; }
.compare-table th .dim-toggle.on { background: #E24B4A; color: #fff; }
.compare-table th .dim-toggle.on:hover { background: #c63d3c; }
.compare-table th .dim-toggle.off { background: #639922; color: #fff; }
.compare-table th .dim-toggle.off:hover { background: #4f7e1b; }
.compare-table th.dim-excluded { opacity: 0.4; }
.compare-table th.dim-excluded .dim-name { text-decoration: line-through; }
.compare-table td.dim-excluded { color: #ccc !important; background: #f9f9f9 !important; text-decoration: line-through; }
.compare-table .dim-hint { font-size: 11px; color: #999; font-weight: 400; margin-left: 8px; }
/* 单企业详情 */
.detail-view { display: none; }
.detail-view .score-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
.score-card { background: #fff; border-radius: 10px; padding: 14px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.score-card .val { font-size: 28px; font-weight: 700; color: #1a1a2e; }
.score-card .lbl { font-size: 12px; color: #888; margin-top: 4px; }
.chart-detail-card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); margin-bottom: 20px; }
.chart-detail-card h3 { font-size: 15px; margin-bottom: 12px; color: #555; }
.chart-detail-card .chart-wrap { position: relative; height: 260px; }
.chart-detail-card canvas { display: block; }
.score-table { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); margin-bottom: 20px; }
.score-table h3 { font-size: 15px; margin-bottom: 12px; color: #555; }
.score-table table { width: 100%; border-collapse: collapse; font-size: 13px; }
.score-table th, .score-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #f0f0f0; }
.score-table th { background: #fafbfc; color: #555; width: 120px; }
.score-table td:nth-child(2) { text-align: center; font-weight: 700; width: 50px; }
.info-box { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.info-box h3 { font-size: 15px; margin-bottom: 12px; color: #555; }
.info-box .info-row { display: flex; gap: 32px; flex-wrap: wrap; font-size: 13px; }
.info-box .info-item { }
.info-box .info-item span { color: #888; }
.info-box .info-item strong { color: #2c3e50; }
/* Toast 提示 */
.toast { position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 8px; font-size: 14px; z-index: 999; opacity: 0; transform: translateX(20px); transition: all 0.3s; }
.toast.show { opacity: 1; transform: translateX(0); }
.toast.success { background: #639922; color: #fff; }
.toast.error { background: #E24B4A; color: #fff; }
.toast.info { background: #4361ee; color: #fff; }
/* 状态按钮 */
.status-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.status-btn { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 20px; border: 2px solid #e0e0e0; background: #fff; cursor: pointer; font-size: 14px; transition: all 0.25s; color: #666; }
.status-btn:hover { transform: scale(1.05); }
.status-btn.active-like { border-color: #e24b4a; background: #fff5f5; color: #e24b4a; box-shadow: 0 2px 8px rgba(226,75,74,0.2); }
.status-btn.active-dislike { border-color: #999; background: #f5f5f5; color: #888; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.status-btn .icon { font-size: 20px; line-height: 1; }
/* 详情页标题与报告链接 */
.detail-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; flex-wrap: wrap; gap: 10px; }
.detail-title h2 { font-size: 22px; color: #1a1a2e; margin: 0; }
.report-link { display: inline-flex; align-items: center; gap: 4px; padding: 6px 14px; border-radius: 6px; background: #4361ee; border: 1.5px solid #4361ee; color: #fff; text-decoration: none; font-size: 13px; font-weight: 500; transition: all 0.2s; white-space: nowrap; cursor: pointer; }
.report-link:hover { background: #3451d1; border-color: #3451d1; box-shadow: 0 2px 8px rgba(67,97,238,0.3); }
/* MD报告弹窗 */
.report-modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 9999; }
.report-modal.show { display: flex; align-items: stretch; justify-content: center; }
.report-modal .backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.5); }
.report-modal .modal-content { position: relative; width: 900px; max-width: 95vw; margin: 40px 0; background: #fff; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); display: flex; flex-direction: column; overflow: hidden; }
.report-modal .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid #eee; flex-shrink: 0; }
.report-modal .modal-header h3 { font-size: 17px; color: #1a1a2e; margin: 0; }
.report-modal .modal-close { width: 32px; height: 32px; border-radius: 50%; border: none; background: #f0f0f0; color: #666; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
.report-modal .modal-close:hover { background: #e0e0e0; color: #333; }
.report-modal .modal-body { padding: 24px 28px; overflow-y: auto; flex: 1; font-size: 14px; line-height: 1.8; color: #2c3e50; }
.report-modal .modal-body h1 { font-size: 22px; margin: 0 0 16px; padding-bottom: 10px; border-bottom: 2px solid #4361ee; color: #1a1a2e; }
.report-modal .modal-body h2 { font-size: 17px; margin: 24px 0 12px; color: #1a1a2e; }
.report-modal .modal-body h3 { font-size: 15px; margin: 18px 0 10px; color: #333; }
.report-modal .modal-body p { margin: 8px 0; }
.report-modal .modal-body table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 13px; }
.report-modal .modal-body table th, .report-modal .modal-body table td { padding: 8px 12px; border: 1px solid #e0e0e0; text-align: left; }
.report-modal .modal-body table th { background: #f5f6fa; font-weight: 600; color: #555; }
.report-modal .modal-body blockquote { border-left: 4px solid #4361ee; margin: 12px 0; padding: 8px 16px; background: #f8f9ff; color: #555; }
.report-modal .modal-body code { background: #f0f0f0; padding: 2px 6px; border-radius: 3px; font-size: 13px; }
.report-modal .modal-body pre { background: #2c3e50; color: #e0e0e0; padding: 16px; border-radius: 8px; overflow-x: auto; }
.report-modal .modal-body pre code { background: none; padding: 0; color: inherit; }
.report-modal .modal-body ul, .report-modal .modal-body ol { margin: 8px 0; padding-left: 24px; }
.report-modal .modal-body hr { border: none; border-top: 1px solid #e0e0e0; margin: 20px 0; }
/* 对比表格行状态 */
.compare-table tr.liked td { background: #dcedc8 !important; font-weight: 600; }
.compare-table tr.disliked td { opacity: 0.35; }
.compare-table tr.disliked:hover td { opacity: 0.55; }
/* 侧边栏状态 */
.company-tab .status-icon { font-size: 12px; flex-shrink: 0; margin-left: 2px; }
.company-tab.liked { background: #fff5f5; }
.company-tab.disliked { opacity: 0.45; }
.company-tab.disliked:hover, .company-tab.disliked.active { opacity: 0.65; }
</style>
</head>
<body>

<!-- ===== 左侧企业列表 ===== -->
<div class="sidebar">
  <h2>📊 企业列表</h2>
  <div id="company-list">
    <!-- company-tab 由 JS 填充 -->
  </div>
  <div class="sidebar-spacer"></div>
  <div class="add-btn" onclick="document.getElementById('md-file-input').click()">
    <span>＋</span> 从 MD 导入企业
  </div>
  <input type="file" id="md-file-input" accept=".md" style="display:none" onchange="addCompanyFromFile(this)">
</div>

<!-- ===== 右侧主区域 ===== -->
<div class="main">
  <div class="header">
    <h1>企业多维对比看板<span class="badge" id="company-count">0 家</span></h1>
  </div>

  <!-- 对比视图 -->
  <div class="compare-view" id="compare-view">
    <div class="charts-row">
      <div class="chart-card">
        <h3>雷达图：8维评分对比</h3>
        <canvas id="radar-chart" height="360"></canvas>
      </div>
      <div class="chart-card">
        <h3>总分排名</h3>
        <canvas id="bar-chart" height="360"></canvas>
      </div>
    </div>
    <div class="compare-table">
      <h3>详细对比表<span class="dim-hint" id="dim-hint"></span></h3>
      <table id="compare-detail-table">
        <thead><tr></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- 单企业详情（默认隐藏，点击 tab 切换） -->
  <div class="detail-view" id="detail-view">
    <div class="status-bar" id="detail-status-bar">
      <button class="status-btn" id="btn-like" onclick="toggleStatus(currentDetailIdx, 'like')"><span class="icon">❤️</span> 重点关注</button>
      <button class="status-btn" id="btn-dislike" onclick="toggleStatus(currentDetailIdx, 'dislike')"><span class="icon">💔</span> 暂时不看</button>
    </div>
    <div class="detail-title" id="detail-title"></div>
    <div class="score-cards" id="detail-cards"></div>
    <div class="chart-detail-card">
      <h3>评分分布</h3>
      <div class="chart-wrap"><canvas id="detail-bar-chart"></canvas></div>
    </div>
    <div class="score-table">
      <h3>评分明细</h3>
      <table id="detail-score-table">
        <thead><tr><th>维度</th><th>得分</th><th>简评</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="info-box">
      <h3>基本信息</h3>
      <div class="info-row" id="detail-info"></div>
    </div>
  </div>

  <!-- 空状态 -->
  <div id="empty-state" style="text-align:center;padding:80px 0;color:#bbb;font-size:15px;">
    暂无企业数据，查询一家企业后自动收录，或点击左下角「从 MD 导入企业」手动添加。
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="report-modal" id="report-modal">
  <div class="backdrop" onclick="closeReport()"></div>
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="report-modal-title">完整调研报告</h3>
      <button class="modal-close" onclick="closeReport()">✕</button>
    </div>
    <div class="modal-body" id="report-modal-body"></div>
  </div>
</div>

<!-- ===== 企业数据（由技能写入） ===== -->
<script>
// ---- 评分维度名称 ----
const DIM_LABELS = ["发展前景","稳定性","薪资竞争力","工作生活平衡","福利完善度","技术成长性","岗位匹配度","公司规模"];

// ---- 颜色配置 ----
const COLORS = [
  "#4361ee","#e24b4a","#639922","#EF9F27","#7209b7","#f72585","#4cc9f0","#06d6a0",
  "#ff6b6b","#45b7d1","#96ceb4","#ffeaa7","#dda0dd","#98d8c8","#f7dc6f","#bb8fce"
];

function scoreColor(v) {
  if (v >= 8) return "#639922";
  if (v >= 5) return "#EF9F27";
  return "#E24B4A";
}

// 表格排序状态：col=-1 表示默认顺序，dir: asc/desc
let sortState = { col: -1, dir: 'desc' };

// 被排除的维度索引集合（点击表头×可排除/恢复）
let excludedDims = new Set();

function sortTable(col) {
  if (sortState.col !== col) {
    sortState.col = col;
    sortState.dir = col === 0 ? 'asc' : 'desc';
  } else {
    // 同一列再次点击：desc → asc → 取消排序（回到默认顺序）
    if (sortState.dir === 'desc') {
      sortState.dir = 'asc';
    } else {
      sortState.col = -1;
      sortState.dir = 'desc';
    }
  }
  renderCompareView();
}

// ---- 企业数据库（新企业追加到此处） ----
const COMPANIES = [
  // 占位：技能运行时替换为实际数据
  // { name:"示例", info:"成立/规模/状态", city:"杭州", position:"测试", positionStatus:"在招",
  //   scores:[8,7,6,5,7,6,5,7], comments:["理由1","理由2",...] }
];

// ==================== localStorage 持久化 ====================
const STORAGE_KEY = "enterprise-dashboard-companies";
const DELETED_KEY = "enterprise-dashboard-deleted";

function saveToStorage() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(COMPANIES));
  } catch(e) { /* quota exceeded, ignore */ }
}

function loadFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (Array.isArray(data) && data.length > 0 &&
        data.every(function(c) { return c.name && Array.isArray(c.scores) && c.scores.length === 8; })) {
      return data;
    }
  } catch(e) {}
  return null;
}

// ==================== Toast 提示 ====================
function showToast(msg, type) {
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.className = "toast " + (type || "info");
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2500);
}

// ==================== MD 报告解析 ====================
function parseMDReport(text) {
  const result = {
    name: "未知企业", info: "", city: "杭州", position: "测试",
    positionStatus: "未知", scores: [], comments: []
  };

  // 1. 企业名称：从 H1 标题提取
  const titleMatch = text.match(/^#\s+(.+?)\s+企业调研报告/m);
  if (titleMatch) result.name = titleMatch[1].trim();

  // 2. 评分表：逐维度提取 | 维度 | 得分 | 简评 |
  // 模板使用 3 列表格；正则必须限制在同一行内，防止 (.+?) 跨行抓到下一行维度
  DIM_LABELS.forEach(dim => {
    const regex = new RegExp(
      "\\|[^|]*" + dim + "[^|]*\\|" +                    // 维度单元格（允许emoji等前缀/后缀）
      "\\s*(?:\\*+)?\\s*(\\d+)\\s*(?:\\*+)?\\s*\\|" +      // 得分单元格
      "\\s*([^|\\n]*?)\\s*\\|"                            // 简评单元格（不跨列、不跨行）
    );
    const match = text.match(regex);
    if (match) {
      result.scores.push(parseInt(match[1]));
      result.comments.push(match[2].trim());
    } else {
      result.scores.push(0);
      result.comments.push("解析失败");
    }
  });

  // 如果所有分数都是 0，说明评分表解析失败
  if (result.scores.every(s => s === 0)) {
    return null;
  }

  // 3. 基本信息：成立年份
  const foundedMatch = text.match(/成立日期\s*\|\s*(\d{4})[-/]/);
  const foundedYear = foundedMatch ? foundedMatch[1] : "";

  // 4. 人员规模
  let sizeStr = "";
  const sizeMatch1 = text.match(/参保(?:人数)?[：:]?\s*(\d+)\s*人/);
  const sizeMatch2 = text.match(/人员?规模[：:]?\s*(\d+[-~]\d+)\s*人/);
  const sizeMatch3 = text.match(/约?(\d+[-~]?\d*)\s*人/);
  if (sizeMatch1) sizeStr = sizeMatch1[1] + "人";
  else if (sizeMatch2) sizeStr = sizeMatch2[1] + "人";
  else if (sizeMatch3) sizeStr = sizeMatch3[1] + "人";

  // 5. 融资/上市状态
  let fundStatus = "";
  if (text.match(/创业板|科创板|深交所|上交所|北交所/)) {
    if (text.match(/创业板/)) fundStatus = "创业板上市";
    else if (text.match(/科创板/)) fundStatus = "科创板上市";
    else fundStatus = "上市";
  } else if (text.match(/[A-Z]\+?轮/)) {
    const roundMatch = text.match(/([A-Z]\+?轮(?:融资)?)/);
    fundStatus = roundMatch ? roundMatch[1] : "融资中";
  } else if (text.match(/天使轮/)) {
    fundStatus = "天使轮";
  }

  // 组合 info
  const infoParts = [];
  if (foundedYear) infoParts.push(foundedYear + "年成立");
  if (sizeStr) infoParts.push(sizeStr);
  if (fundStatus) infoParts.push(fundStatus);
  result.info = infoParts.join(" / ") || "解析失败";

  // 6. 城市 & 岗位：从「## 四、补充信息（XXX）」提取
  const suppMatch = text.match(/##\s*四、\s*补充信息[（(]([^)）]+)/);
  if (suppMatch) {
    const suppText = suppMatch[1];
    const cityMatch = suppText.match(/杭州|上海|北京|深圳|广州|成都|南京|苏州|武汉/);
    if (cityMatch) result.city = cityMatch[0];
    if (suppText.includes("测开") || suppText.includes("测试开发")) result.position = "测试开发";
    else if (suppText.includes("测试")) result.position = "测试";
  }

  // 7. 岗位状态：搜索「在招」关键词
  if (text.match(/在招/)) result.positionStatus = "在招";
  else if (text.match(/未找到|无.*岗位|暂无/)) result.positionStatus = "未找到";
  else result.positionStatus = "未知";

  return result;
}

// ==================== 从 MD 文件导入企业 ====================
function addCompanyFromFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const text = e.target.result;
    const company = parseMDReport(text);
    if (!company) {
      showToast("MD 文件解析失败，未找到有效的评分数据", "error");
      input.value = "";
      return;
    }
    // 导入时默认 status = 'normal'（如果是覆盖，保留原 status）
    if (!company.status) company.status = 'normal';

    // 检查是否已存在同名企业
    const existIdx = COMPANIES.findIndex(c => c.name === company.name);
    if (existIdx >= 0) {
      if (confirm('看板中已存在「' + company.name + '」，是否覆盖？')) {
        COMPANIES[existIdx] = company;
        saveToStorage();
        showToast("已覆盖更新：" + company.name, "success");
        renderAll();
        showDetail(existIdx);
      }
    } else {
      COMPANIES.push(company);
      saveToStorage();
      showToast("已添加：" + company.name, "success");
      renderAll();
      showDetail(COMPANIES.length - 1);
    }
    input.value = "";
  };
  reader.readAsText(file, "UTF-8");
}

// ==================== 删除企业 ====================
function deleteCompany(idx, event) {
  event.stopPropagation();
  const c = COMPANIES[idx];
  if (!c) return;
  if (confirm('确认从看板中删除「' + c.name + '」？\n（不会删除本地 MD 报告文件）')) {
    COMPANIES.splice(idx, 1);
    saveToStorage();
    // 记录到删除黑名单，防止刷新后 initData 合并回来
    var deleted = [];
    try { deleted = JSON.parse(localStorage.getItem(DELETED_KEY) || '[]'); } catch(e) {}
    if (deleted.indexOf(c.name) === -1) deleted.push(c.name);
    localStorage.setItem(DELETED_KEY, JSON.stringify(deleted));
    // 调整当前选中索引
    if (currentDetailIdx === idx) {
      currentDetailIdx = -1;
    } else if (currentDetailIdx > idx) {
      currentDetailIdx--;
    }
    showToast("已删除：" + c.name, "info");
    renderAll();
  }
}

// ==================== 爱心/心碎 状态切换 ====================
function toggleStatus(idx, status) {
  if (idx < 0 || idx >= COMPANIES.length) return;
  const c = COMPANIES[idx];
  c.status = (c.status === status) ? 'normal' : status;
  saveToStorage();
  renderAll();
}

function updateStatusButtons() {
  var idx = currentDetailIdx;
  var btnLike = document.getElementById("btn-like");
  var btnDislike = document.getElementById("btn-dislike");
  if (idx < 0 || idx >= COMPANIES.length) return;
  var s = COMPANIES[idx].status || "normal";
  btnLike.className = "status-btn" + (s === "like" ? " active-like" : "");
  btnDislike.className = "status-btn" + (s === "dislike" ? " active-dislike" : "");
}

// ==================== 渲染逻辑 ====================
let currentDetailIdx = -1;

function renderAll() {
  renderCompanyList();
  if (COMPANIES.length === 0) {
    document.getElementById("empty-state").style.display = "block";
    document.getElementById("compare-view").style.display = "none";
    document.getElementById("detail-view").style.display = "none";
  } else {
    document.getElementById("empty-state").style.display = "none";
    document.getElementById("company-count").textContent = COMPANIES.length + " 家";
    if (currentDetailIdx >= 0 && currentDetailIdx < COMPANIES.length) {
      showDetail(currentDetailIdx);
    } else {
      showDetail(-1);
    }
  }
}

function getTotal(scores) {
  return scores.reduce((a,b)=>a+b,0);
}

// 按剩余维度计算总分
function getActiveTotal(scores) {
  let sum = 0;
  for (let i = 0; i < scores.length; i++) {
    if (!excludedDims.has(i)) sum += scores[i];
  }
  return sum;
}

// 剩余维度数
function getActiveDimCount() {
  return DIM_LABELS.length - excludedDims.size;
}

// 切换维度排除/恢复
function toggleDim(idx) {
  if (excludedDims.has(idx)) {
    excludedDims.delete(idx);
  } else {
    if (excludedDims.size >= DIM_LABELS.length - 1) {
      showToast("至少需要保留一个维度");
      return;
    }
    excludedDims.add(idx);
  }
  sortState = { col: -1, dir: 'desc' };
  renderCompareView();
}

// 恢复全部维度
function resetDims() {
  excludedDims.clear();
  sortState = { col: -1, dir: 'desc' };
  renderCompareView();
}

function renderCompanyList() {
  const list = document.getElementById("company-list");
  list.innerHTML = COMPANIES.map((c,i) => {
    const active = i === currentDetailIdx;
    const color = COLORS[i % COLORS.length];
    const total = getTotal(c.scores);
    const st = c.status || 'normal';
    const statusIcon = st === 'like' ? ' ❤️' : st === 'dislike' ? ' 💔' : '';
    const cls = 'company-tab' + (active?' active':'') + (st==='like'?' liked':'') + (st==='dislike'?' disliked':'');
    return '<div class="' + cls + '" onclick="showDetail(' + i + ')">' +
      '<span class="dot" style="background:' + color + '"></span>' +
      '<span class="name">' + c.name + '</span>' +
      '<span class="status-icon">' + statusIcon + '</span>' +
      '<span class="score-tag">' + total + '</span>' +
      '<button class="delete-btn" onclick="deleteCompany(' + i + ', event)" title="删除">\u00d7</button>' +
    '</div>';
  }).join("");
  // 添加"对比"tab
  const active = currentDetailIdx === -1;
  list.innerHTML += '<div class="company-tab' + (active?' active':'') + '" onclick="showDetail(-1)" style="margin-top:8px;border-top:1px solid #eee;padding-top:14px;">' +
    '<span class="dot" style="background:#666"></span><span class="name">全部对比</span>' +
  '</div>';
}

function renderCompareView() {
  if (COMPANIES.length === 0) return;
  document.getElementById("compare-view").style.display = "block";

  // 图表：排除心碎（dislike）企业，爱心（like）企业排前面
  const chartCompanies = [];
  const likeList = [], normalList = [];
  COMPANIES.forEach((c,i) => {
    if ((c.status || 'normal') === 'like') likeList.push(i);
    else if ((c.status || 'normal') !== 'dislike') normalList.push(i);
  });
  likeList.concat(normalList).forEach(i => chartCompanies.push(COMPANIES[i]));
  if (chartCompanies.length === 0) chartCompanies.push.apply(chartCompanies, COMPANIES);

  // 雷达图
  const radarCtx = document.getElementById("radar-chart").getContext("2d");
  if (window._radarChart) window._radarChart.destroy();
  // 仅保留未排除维度的标签与数据
  const radarLabels = DIM_LABELS.filter((_, idx) => !excludedDims.has(idx));
  window._radarChart = new Chart(radarCtx, {
    type: "radar",
    data: {
      labels: radarLabels,
      datasets: chartCompanies.map((c,i) => ({
        label: c.name,
        data: c.scores.filter((_, idx) => !excludedDims.has(idx)),
        borderColor: COLORS[i % COLORS.length],
        backgroundColor: COLORS[i % COLORS.length] + "20",
        borderWidth: (c.status==='like'?3:2),
        pointRadius: (c.status==='like'?5:4)
      }))
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      scales: { r: { min: 0, max: 10, ticks: { stepSize: 2, font: { size: 10 } } } },
      plugins: { legend: { position: "bottom", labels: { font: { size: 11 }, usePointStyle: true } } }
    }
  });

  // 总分排名柱状图
  const barCtx = document.getElementById("bar-chart").getContext("2d");
  if (window._barChart) window._barChart.destroy();
  const activeMax = getActiveDimCount() * 10;
  const sorted = chartCompanies.map(c => ({name:c.name, total:getActiveTotal(c.scores), liked:c.status==='like'}))
    .sort((a,b) => b.total - a.total);
  window._barChart = new Chart(barCtx, {
    type: "bar",
    data: {
      labels: sorted.map(x=>x.name),
      datasets: [{
        data: sorted.map(x=>x.total),
        backgroundColor: sorted.map((x,i) => COLORS[i % COLORS.length] + "88"),
        borderColor: sorted.map((x,i) => COLORS[i % COLORS.length]),
        borderWidth: sorted.map(x => x.liked ? 3 : 1),
        borderRadius: 4
      }]
    },
    options: {
      indexAxis: "y",
      responsive: true,
      maintainAspectRatio: true,
      scales: { x: { min: 0, max: activeMax, ticks: { stepSize: Math.max(1, Math.ceil(activeMax/10)) } } },
      plugins: { legend: { display: false } }
    }
  });

  // 对比表格（支持排序）
  const thead = document.querySelector("#compare-detail-table thead tr");
  const tbody = document.querySelector("#compare-detail-table tbody");
  const arrow = (col) => {
    const active = sortState.col === col;
    const glyph = active ? (sortState.dir === 'asc' ? '↑' : '↓') : '↕';
    const cls = active ? 'sort-btn active' : 'sort-btn';
    const title = active ? '再次点击取消排序' : '点击排序';
    return '<span class="'+cls+'" onclick="event.stopPropagation();sortTable('+col+')" title="'+title+'">'+glyph+'</span>';
  };
  const activeCls = (col) => sortState.col === col ? 'sortable active' : 'sortable';
  let h = '<th class="'+activeCls(0)+'" onclick="sortTable(0)">企业'+arrow(0)+'</th>';
  DIM_LABELS.forEach((d, idx) => {
    const excluded = excludedDims.has(idx);
    const dimCls = excluded ? 'dim-excluded' : '';
    const toggleIcon = excluded ? '✓' : '✕';
    const toggleCls = excluded ? 'off' : 'on';
    const toggleTitle = excluded ? '恢复该维度' : '排除该维度';
    h += '<th class="'+activeCls(idx+1)+' '+dimCls+'" onclick="sortTable('+(idx+1)+')"><span class="dim-name">'+d+'</span>'+arrow(idx+1)+'<span class="dim-toggle '+toggleCls+'" onclick="event.stopPropagation();toggleDim('+idx+')" title="'+toggleTitle+'">'+toggleIcon+'</span></th>';
  });
  const activeN = getActiveDimCount();
  h += '<th class="'+activeCls(DIM_LABELS.length+1)+'" onclick="sortTable('+(DIM_LABELS.length+1)+')">总分/'+(activeN*10)+arrow(DIM_LABELS.length+1)+'</th>';
  h += '<th class="'+activeCls(DIM_LABELS.length+2)+'" onclick="sortTable('+(DIM_LABELS.length+2)+')">均分'+arrow(DIM_LABELS.length+2)+'</th>';
  thead.innerHTML = h;

  // 更新提示文字
  const hintEl = document.getElementById("dim-hint");
  if (excludedDims.size > 0) {
    const excludedNames = [...excludedDims].map(i => DIM_LABELS[i]).join("、");
    hintEl.innerHTML = '已排除：'+excludedNames+' · <a href="javascript:resetDims()" style="color:#4361ee;cursor:pointer">恢复全部</a>';
  } else {
    hintEl.innerHTML = '点击表头 ✕ 可排除维度并重新计分';
  }

  // 构建带原始索引的显示顺序
  let displayOrder = COMPANIES.map((c, i) => ({ idx: i, c: c }));
  if (sortState.col >= 0) {
    const col = sortState.col;
    const dir = sortState.dir === 'asc' ? 1 : -1;
    displayOrder.sort((a, b) => {
      let va, vb;
      if (col === 0) { return a.c.name.localeCompare(b.c.name, 'zh') * dir; }
      else if (col <= DIM_LABELS.length) { va = a.c.scores[col-1]; vb = b.c.scores[col-1]; }
      else if (col === DIM_LABELS.length + 1) { va = getActiveTotal(a.c.scores); vb = getActiveTotal(b.c.scores); }
      else { va = getActiveTotal(a.c.scores)/getActiveDimCount(); vb = getActiveTotal(b.c.scores)/getActiveDimCount(); }
      return (va - vb) * dir;
    });
  }

  tbody.innerHTML = displayOrder.map(item => {
    const i = item.idx;
    const c = item.c;
    const total = getActiveTotal(c.scores);
    const avg = (total/getActiveDimCount()).toFixed(1);
    const st = c.status || 'normal';
    const rowCls = st === 'like' ? 'liked' : st === 'dislike' ? 'disliked' : '';
    let nameCell = c.name;
    if (st === 'like') nameCell = '❤️ ' + nameCell;
    else if (st === 'dislike') nameCell = '💔 ' + nameCell;
    let row = '<td style="font-weight:600;color:#4A90D9;cursor:pointer" onclick="showDetail('+i+')">'+nameCell+'</td>';
    c.scores.forEach((s, si) => {
      if (excludedDims.has(si)) {
        row += '<td class="dim-excluded">'+s+'</td>';
      } else {
        row += '<td class="'+(s>=8?'score-high':s>=5?'score-mid':'score-low')+'">'+s+'</td>';
      }
    });
    row += '<td style="font-weight:700">'+total+'</td><td style="font-weight:600">'+avg+'</td>';
    return '<tr class="'+rowCls+'">'+row+'</tr>';
  }).join("");

  for (let col = 1; col <= DIM_LABELS.length; col++) {
    if (excludedDims.has(col-1)) continue;
    let maxVal = -1, maxIdx = -1;
    COMPANIES.forEach((c, i) => { if (c.scores[col-1] > maxVal) { maxVal = c.scores[col-1]; maxIdx = i; } });
    if (maxIdx >= 0) {
      const rowIdx = displayOrder.findIndex(d => d.idx === maxIdx);
      const td = tbody.rows[rowIdx]?.cells[col];
      if (td) td.classList.add("highlight");
    }
  }
}

function showDetail(idx) {
  currentDetailIdx = idx;
  const detailView = document.getElementById("detail-view");
  const compareView = document.getElementById("compare-view");

  if (idx === -1) {
    // 对比视图
    compareView.style.display = "block";
    detailView.style.display = "none";
    renderCompareView();
  } else {
    const c = COMPANIES[idx];
    compareView.style.display = "none";
    detailView.style.display = "block";
    const total = getTotal(c.scores);
    const avg = (total/8).toFixed(1);
    const max = Math.max(...c.scores);
    const min = Math.min(...c.scores);

    // 企业标题 + 查看完整报告按钮
    document.getElementById("detail-title").innerHTML =
      '<h2>'+c.name+'</h2>'+
      '<span class="report-link" onclick="openReport(\''+c.name.replace(/'/g,"\\'")+'\')">📄 查看完整报告</span>';

    // 指标卡
    document.getElementById("detail-cards").innerHTML =
      '<div class="score-card"><div class="val">' + total + '</div><div class="lbl">总分 / 80</div></div>' +
      '<div class="score-card"><div class="val">' + avg + '</div><div class="lbl">均分</div></div>' +
      '<div class="score-card"><div class="val" style="color:#639922">' + max + '</div><div class="lbl">最高分</div></div>' +
      '<div class="score-card"><div class="val" style="color:#E24B4A">' + min + '</div><div class="lbl">最低分</div></div>';

    // 水平条形图
    const ctx = document.getElementById("detail-bar-chart").getContext("2d");
    if (window._detailChart) window._detailChart.destroy();
    window._detailChart = new Chart(ctx, {
      type: "bar",
      data: {
        labels: DIM_LABELS,
        datasets: [{
          label: c.name,
          data: c.scores,
          backgroundColor: c.scores.map(s => scoreColor(s) + "cc"),
          borderColor: c.scores.map(s => scoreColor(s)),
          borderWidth: 1,
          borderRadius: 4
        }]
      },
      options: {
        indexAxis: "y",
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: { min: 0, max: 10, ticks: { stepSize: 1, font: { size: 11 } }, grid: { color: "#f0f0f0" } },
          y: { ticks: { font: { size: 12 } }, grid: { display: false } }
        },
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: ctx => ctx.raw + " / 10" } }
        }
      }
    });

    // 评分明细表
    const tbody = document.querySelector("#detail-score-table tbody");
    tbody.innerHTML = DIM_LABELS.map((d,i) => {
      const s = c.scores[i];
      return '<tr>' +
        '<td>' + d + '</td>' +
        '<td style="color:' + scoreColor(s) + ';font-weight:700">' + s + '</td>' +
        '<td style="color:#666">' + (c.comments[i] || "") + '</td>' +
      '</tr>';
    }).join("");

    // 基本信息
    document.getElementById("detail-info").innerHTML =
      '<div class="info-item"><span>成立 / 规模：</span><strong>' + c.info + '</strong></div>' +
      '<div class="info-item"><span>城市：</span><strong>' + c.city + '</strong></div>' +
      '<div class="info-item"><span>目标岗位：</span><strong>' + c.position + '</strong></div>' +
      '<div class="info-item"><span>岗位状态：</span><strong style="color:' + (c.positionStatus.indexOf('在招')>=0?'#639922':'#E24B4A') + '">' + c.positionStatus + '</strong></div>';
  }

  renderCompanyList();
  updateStatusButtons();
}

// 优先从 localStorage 恢复 ❤️/💔 状态，自动合并主数组中新增的企业（单一数据源）
(function initData() {
  // 保存主 COMPANIES 数组的快照（后续新增企业从此自动合并，无需手动同步）
  var defaults = COMPANIES.slice();

  var saved = loadFromStorage();
  if (saved) {
    COMPANIES.length = 0;
    Array.prototype.push.apply(COMPANIES, saved);
  }
  // 迁移：旧数据没有 status 字段，补上默认值
  var migrated = false;
  for (var i = 0; i < COMPANIES.length; i++) {
    if (!COMPANIES[i].status) { COMPANIES[i].status = 'normal'; migrated = true; }
  }
  // 合并：主数组中有但 localStorage 中没有的新增企业自动追加（跳过用户已删除的）
  var deleted = [];
  try { deleted = JSON.parse(localStorage.getItem(DELETED_KEY) || '[]'); } catch(e) {}
  var merged = false;
  for (var k = 0; k < defaults.length; k++) {
    if (deleted.indexOf(defaults[k].name) !== -1) continue; // 用户删过的跳过
    var found = false;
    for (var j = 0; j < COMPANIES.length; j++) {
      if (COMPANIES[j].name === defaults[k].name) { found = true; break; }
    }
    if (!found) {
      COMPANIES.push(defaults[k]);
      merged = true;
    }
  }
  if (merged || migrated) saveToStorage();
})();

renderAll();

function openReport(name) {
  var modal = document.getElementById("report-modal");
  var body = document.getElementById("report-modal-body");
  var title = document.getElementById("report-modal-title");
  var url = "http://localhost:8765/企业调研报告_" + encodeURIComponent(name) + ".md";
  title.textContent = name + " \u00b7 完整调研报告";
  body.innerHTML = '<div style="text-align:center;padding:60px 0;color:#888;">加载中...</div>';
  modal.classList.add("show");
  document.body.style.overflow = "hidden";
  fetch(url)
    .then(function(r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(function(md) {
      body.innerHTML = marked.parse(md);
    })
    .catch(function(e) {
      body.innerHTML = '<div style="text-align:center;padding:60px 0;color:#E24B4A;">' +
        '<p style="font-size:18px;margin-bottom:8px;">无法加载报告</p>' +
        '<p style="font-size:13px;color:#999;">'+e.message+'</p>' +
        '<p style="font-size:13px;color:#999;">文件: '+url+'</p></div>';
    });
}

function closeReport() {
  document.getElementById("report-modal").classList.remove("show");
  document.body.style.overflow = "";
}
